#sb{width:215px;min-width:215px;background:#fff;border-right:1px solid #dde6ea;display:flex;flex-direction:column;height:100vh}

.anm{font-size:11px;font-weight:700;color:#1B5C54;display:flex;align-items:center;gap:4px}

.ait{display:none}
.acc.o+.ait{display:block}

#cm{font-size:10px;color:#7a9aaa;margin-top:1px}

.tl{font-size:10px;color:#8fa4b0}

.tbm{background:#BA7517!important;color:#fff!important;border-color:#BA7517!important}

.cc{background:#fff;border:1px solid #dde6ea;border-radius:8px;padding:12px}
.ct{font-size:11px;font-weight:700;color:#506070;margin-bottom:8px}
.cw{position:relative;height:140px}
.tc{background:#fff;border:1px solid #dde6ea;border-radius:8px;overflow:hidden;flex-shrink:0}

var sel=null,tt="m",op={},ch={};
var ML=["11월","12월","1월","2월","3월","4월"];
function fmt(v){return v?(v/10000).toFixed(1)+"억":"-";}
function av(a){return a.length?Math.round(a.reduce(function(s,x){return s+x;},0)/a.length):0;}
function buildSb(q){
  if(!D){return;}
  q=(q||"").trim();var h="";
  var sx=D["수지구"];
  for(var g in sx){
    var lst=q?sx[g].filter(function(c){return c.name.indexOf(q)>=0;}):sx[g];
    if(!lst.length)continue;
    var isO=q?true:(op[g]!==false);
    h+='<div class="acc'+(isO?" o":"")+'" onclick="togA(this,''+g+'')">';
    h+='<span class="anm"><span class="ar">&#9654;</span>'+g+'</span>';
    h+='<span class="acnt">'+lst.length+'</span></div>';
    h+='<div class="ait" style="'+(isO?"":"display:none")+'">';
    for(var i=0;i<lst.length;i++){
      var c=lst[i],on=(sel&&sel.name===c.name)?" on":"";
      var cn=c.tradeCount?'<span class="cin">'+c.tradeCount+'</span>':"";
      h+='<div class="ci'+on+'" onclick="pickCI(this,''+g+'')" data-nm="'+c.name.replace(/"/g,"&quot;")+'">'+c.name+cn+'</div>';
    }
    h+='</div>';
  }
  if(!h)h='<div style="padding:16px;text-align:center;color:#8fa4b0;font-size:11px">결과 없음</div>';
  document.getElementById("sbl").innerHTML=h;
}
function togA(el,g){
  var isO=el.classList.contains("o");
  op[g]=!isO;el.classList.toggle("o",!isO);
  var nx=el.nextElementSibling;
  if(nx)nx.style.display=isO?"none":"block";
}
function pickCI(el,g){pick(g,el.getAttribute("data-nm"));}
function doSearch(v){buildSb(v);}
function pickFirst(v){
  if(!v||!D)return;var q=v.trim();
  var sx=D["수지구"];
  for(var g in sx)for(var i=0;i<sx[g].length;i++)
    if(sx[g][i].name.indexOf(q)>=0){op[g]=true;pick(g,sx[g][i].name);return;}
}
function pick(g,name){
  if(!D||!D["수지구"]||!D["수지구"][g])return;
  var lst=D["수지구"][g],found=null;
  for(var i=0;i<lst.length;i++)if(lst[i].name===name){found=lst[i];break;}
  if(!found)return;
  sel=found;
  document.getElementById("cn").textContent=name;
  document.getElementById("cm").textContent=g+" · "+(found.year?found.year+"년 준공 · ":"")+"거래 "+found.tradeCount+"건 (2025 국토부)";
  op[g]=true;
  buildSb(document.getElementById("qi").value);
  setTimeout(function(){var el=document.querySelector(".ci.on");if(el)el.scrollIntoView({block:"nearest"});},30);
  renderOv();renderCmp();renderSum();
}
function sr(n){return((n*16807+1)&0x7fffffff)/0x7fffffff;}
function genSim(cx){
  var b=cx.name.length*137+(cx.year||2010),R={m:[],j:[],w:[]};
  for(var mo=0;mo<6;mo++){
    var types=cx.types||["84"],cnt=1+Math.floor(sr(b+mo*31)*3);
    for(var i=0;i<cnt;i++){
      var s=b+mo*31+i*7,t=types[i%types.length];
      var bp=(cx.bp&&(cx.bp[parseInt(t)]||cx.bp[84]))||70000;
      var fl=3+Math.floor(sr(s+2)*15);
      var act=Math.round((bp+Math.round((sr(s)*10-5)*500))/500)*500;
      R.m.push({mo:mo,mL:ML[mo],t:t,fl:fl,act:act,li:act+Math.round((2000+sr(s+1)*3000)/500)*500});
      var jr=(cx.rr||0.63)+(sr(s+10)*0.04-0.02);
      R.j.push({mo:mo,mL:ML[mo],t:t,fl:fl+1,act:Math.round(act*jr/100)*100,rate:Math.round(jr*100)});
      if(i%2===0){var dep=Math.round(act*0.12/100)*100,mon=Math.round((act-dep)*0.004/10)*10;R.w.push({mo:mo,mL:ML[mo],t:t,fl:fl,dep:dep,mon:mon,yld:Math.round(mon*12/(act-dep)*10)/10});}
    }
  }
  return R;
}
function getReal(name){
  var trades=TX&&TX[name];if(!trades||!trades.length)return null;
  var now=new Date(),R={m:[],j:[],w:[]};
  for(var i=0;i<trades.length;i++){
    var t=trades[i],ym=String(t.ym||"202501");
    var diff=(now.getFullYear()-parseInt(ym.slice(0,4)))*12+(now.getMonth()+1-parseInt(ym.slice(4,6)));
    if(diff<0||diff>5)continue;
    R.m.push({mo:5-diff,mL:ML[5-diff],t:t.areaBin||"84",fl:parseInt(t.floor)||5,act:t.price,li:Math.round(t.price*1.03/100)*100});
  }
  return R.m.length?R:null;
}
function getD(cx){return getReal(cx.name)||genSim(cx);}
function setType(t){
  tt=t;
  var m={m:"tbm",j:"tbj",w:"tbw"};
  ["m","j","w"].forEach(function(id){document.getElementById("bt"+id).className="tb"+(id===t?" "+m[id]:"");});
  if(sel)renderOv();
}
function showTab(t){
  ["ov","cmp","sum"].forEach(function(id){
    document.getElementById("p"+id).className="pnl"+(id===t?" on":"");
    document.getElementById("t"+id).className="tab"+(id===t?" on":"");
  });
}
function dc(id){if(ch[id]){ch[id].destroy();delete ch[id];}}
function renderOv(){
  if(!sel)return;
  document.getElementById("emp").style.display="none";
  var mc=document.getElementById("mc");mc.style.display="flex";

  var col={m:"#BA7517",j:"#1B6FA8",w:"#2B7A6F"}[tt];
  var mh="";
  if(tt==="m"){
    var t84=lat.filter(function(x){return x.t==="84";});
    var aM=t84.length?av(t84.map(function(x){return x.act;})):bp84;
    var tJ=DATA.j.filter(function(x){return x.mo===5&&x.t==="84";});
    var aJ=tJ.length?av(tJ.map(function(x){return x.act;})):Math.round(bp84*(cx.rr||0.63));
    mh='<div class="met ma"><div class="ml">이번달매매</div><div class="mv">'+lat.length+'건</div><div class="ms">6개월 '+arr.length+'건</div></div>'+
       '<div class="met ma"><div class="ml">84㎡평균</div><div class="mv">'+fmt(aM)+'</div><div class="ms">실거래</div></div>'+
       '<div class="met mb"><div class="ml">전세가율</div><div class="mv">'+Math.round(aJ/aM*100)+'%</div><div class="ms">'+fmt(aJ)+'</div></div>'+
       '<div class="met mt"><div class="ml">연간거래</div><div class="mv">'+cx.tradeCount+'</div><div class="ms">2025년</div></div>';
    document.getElementById("tT").textContent="월별 매매 실거래가 (84㎡)";
  }else if(tt==="j"){
    var t84j=lat.filter(function(x){return x.t==="84";});
    var aJ2=t84j.length?av(t84j.map(function(x){return x.act;})):Math.round(bp84*(cx.rr||0.63));
    mh='<div class="met mb"><div class="ml">이번달전세</div><div class="mv">'+lat.length+'건</div><div class="ms">6개월 '+arr.length+'건</div></div>'+
       '<div class="met mb"><div class="ml">84㎡전세</div><div class="mv">'+fmt(aJ2)+'</div><div class="ms">추정</div></div>'+
       '<div class="met mb"><div class="ml">전세가율</div><div class="mv">'+Math.round(aJ2/bp84*100)+'%</div><div class="ms">매매대비</div></div>'+
       '<div class="met ma"><div class="ml">매매평균</div><div class="mv">'+fmt(bp84)+'</div><div class="ms">84㎡</div></div>';
    document.getElementById("tT").textContent="전세 추이 (84㎡)";
  }else{
    var wa=DATA.w.filter(function(x){return x.mo===5;});
    var aD=wa.length?av(wa.map(function(x){return x.dep;})):Math.round(bp84*0.12);
    var aMn=wa.length?av(wa.map(function(x){return x.mon;})):Math.round((bp84-aD)*0.004);
    mh='<div class="met mt"><div class="ml">이번달월세</div><div class="mv">'+wa.length+'건</div><div class="ms">6개월 '+DATA.w.length+'건</div></div>'+
       '<div class="met mt"><div class="ml">보증금</div><div class="mv">'+fmt(aD)+'</div><div class="ms">84㎡</div></div>'+
       '<div class="met mt"><div class="ml">월세</div><div class="mv">'+Math.round(aMn/10000)+'만</div><div class="ms">84㎡</div></div>'+
       '<div class="met mt"><div class="ml">수익률</div><div class="mv">'+Math.round(aMn*12/(bp84-aD)*10)/10+'%</div><div class="ms">연환산</div></div>';
    document.getElementById("tT").textContent="보증금 추이";
  }
  document.getElementById("mets").innerHTML=mh;
  var tD=ML.map(function(_,mi){
    var sub=(tt==="w"?DATA.w:arr).filter(function(x){return x.mo===mi&&x.t==="84";});
    if(!sub.length)return null;
    return av(sub.map(function(x){return tt==="w"?x.dep:x.act;}));
  });
  dc("c1");
  ch.c1=new Chart(document.getElementById("c1").getContext("2d"),{type:"line",
    data:{labels:ML,datasets:[{data:tD,borderColor:col,backgroundColor:col+"22",borderWidth:2,pointBackgroundColor:col,pointRadius:4,tension:.35,spanGaps:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{color:"rgba(0,0,0,0.04)"},ticks:{font:{size:9},color:"#888"}},
              y:{grid:{color:"rgba(0,0,0,0.04)"},ticks:{font:{size:9},color:"#888",callback:function(v){return(v/10000).toFixed(0)+"억";}}}}}});
  var tc={};arr.forEach(function(x){tc[x.t]=(tc[x.t]||0)+1;});var tK=Object.keys(tc);
  dc("c2");
  ch.c2=new Chart(document.getElementById("c2").getContext("2d"),{type:"doughnut",
    data:{labels:tK.map(function(t){return t+"㎡";}),
      datasets:[{data:tK.map(function(t){return tc[t];}),backgroundColor:["#BA7517","#1B6FA8","#2B7A6F","#D85A30"],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:9},color:"#888"}}}}});
  var lbl={m:"매매",j:"전세",w:"월세"}[tt];
  document.getElementById("tblT").textContent="최근 "+lbl+" 거래 내역";
  document.getElementById("tblN").textContent="총 "+arr.length+"건";
  var sorted=arr.slice().sort(function(a,b){return b.mo-a.mo;}).slice(0,15);
  var thh="",tbh="";
  if(tt==="m"){
    thh='<tr><th>월</th><th>타입</th><th>층</th><th>실거래가</th><th>호가추정</th><th>괴리</th></tr>';
    sorted.forEach(function(x){tbh+='<tr><td>'+x.mL+'</td><td>'+x.t+'㎡</td><td>'+x.fl+'층</td><td class="fw">'+fmt(x.act)+'</td><td style="color:#aaa">'+fmt(x.li)+'</td><td class="dn">-'+fmt(x.li-x.act)+'</td></tr>';});
  }else if(tt==="j"){
    thh='<tr><th>월</th><th>타입</th><th>층</th><th>전세</th><th>전세가율</th></tr>';
    sorted.forEach(function(x){tbh+='<tr><td>'+x.mL+'</td><td>'+x.t+'㎡</td><td>'+x.fl+'층</td><td class="fw" style="color:#1B6FA8">'+fmt(x.act)+'</td><td style="color:#1B6FA8">'+(x.rate||"")+'%</td></tr>';});
  }else{
    thh='<tr><th>월</th><th>타입</th><th>층</th><th>보증금</th><th>월세</th><th>수익률</th></tr>';
    var ws=DATA.w.slice().sort(function(a,b){return b.mo-a.mo;}).slice(0,15);
    ws.forEach(function(x){tbh+='<tr><td>'+x.mL+'</td><td>'+x.t+'㎡</td><td>'+x.fl+'층</td><td class="fw" style="color:#2B7A6F">'+fmt(x.dep)+'</td><td style="color:#2B7A6F">'+Math.round(x.mon/10000)+'만</td><td class="ok">'+x.yld+'%</td></tr>';});
  }
  document.getElementById("thead").innerHTML=thh;
  document.getElementById("tbody").innerHTML=tbh;
}
function renderCmp(){
  if(!sel)return;
  var cx=sel,h="";
  (cx.types||["84"]).forEach(function(t){
    var ti=parseInt(t),bp=(cx.bp&&cx.bp[ti])||70000,rr=cx.rr||0.63;
    var jv=Math.round(bp*rr/100)*100,dep=Math.round(bp*0.12/100)*100,mon=Math.round((bp-dep)*0.004/10)*10;
    var yl=Math.round(mon*12/(bp-dep)*10)/10,cnt=getD(cx).m.filter(function(x){return x.t===t;}).length;
    h+='<tr><td class="fw">'+t+'㎡</td><td class="fw" style="color:#BA7517">'+fmt(bp)+'</td><td style="color:#1B6FA8">'+Math.round(rr*100)+'%</td><td class="fw" style="color:#1B6FA8">'+fmt(jv)+'</td><td>'+fmt(dep)+'</td><td class="fw" style="color:#2B7A6F">'+Math.round(mon/10000)+'만</td><td class="ok">'+yl+'%</td><td style="color:#888">'+cnt+'건</td></tr>';
  });
  document.getElementById("cmpB").innerHTML=h;
  document.getElementById("cmpT").textContent=sel.name+" 시세표";
}
function renderSum(){
  var sx=D["수지구"],rows=[],h="";
  for(var g in sx)sx[g].forEach(function(c){rows.push({c:c,g:g});});
  document.getElementById("sumN").textContent=rows.length+"개 단지";
  rows.forEach(function(r){
    var c=r.c,bp=(c.bp&&(c.bp[84]||c.bp[59]||c.bp[74]||Object.values(c.bp)[0]))||0;
    var rr=c.rr||0.63,jv=bp?Math.round(bp*rr/100)*100:0;
    var hi=(sel&&sel.name===c.name)?' style="background:#e4f2ef"':'';
    h+='<tr'+hi+'><td class="fw" style="cursor:pointer;color:#1B5C54" onclick="pickRow(this)">'+c.name+'</td><td style="color:#888">'+r.g+'</td><td style="color:#888">'+(c.year||"-")+'</td><td class="fw" style="color:#BA7517">'+fmt(bp)+'</td><td style="color:#1B6FA8">'+Math.round(rr*100)+'%</td><td style="color:#1B6FA8">'+fmt(jv)+'</td><td style="color:#888">'+c.tradeCount+'건</td></tr>';
  });
  document.getElementById("sumB").innerHTML=h;
}
function pickRow(el){
  var tr=el.parentElement;
  var g=tr.cells[1].textContent;
  op[g]=true;pick(g,el.textContent);showTab("ov");
}
window.onload=function(){
  if(!D){document.getElementById("sbt").textContent="⚠️ 데이터 오류";return;}
  var sx=D["수지구"],first=true;
  for(var g in sx){op[g]=first;first=false;}
  buildSb("");
  var gs=Object.keys(sx);
  if(gs.length&&sx[gs[0]].length)pick(gs[0],sx[gs[0]][0].name);
  renderSum();
  document.getElementById("sbt").textContent="매매 실거래 (2025 국토부) · 216개 단지";
};
</script>
