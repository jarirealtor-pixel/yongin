*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;background:#f0f4f6;color:#1a2530;height:100vh;overflow:hidden;display:flex}
/* 사이드바 */
#sb{width:215px;min-width:215px;background:#fff;border-right:1px solid #dde6ea;display:flex;flex-direction:column;height:100vh}
#sb-head{background:#2B7A6F;padding:10px 12px;flex-shrink:0}
#sb-head h1{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px}
#sb-head p{font-size:9px;color:rgba(255,255,255,.75)}
#sb-search{padding:6px 8px;border-bottom:1px solid #dde6ea;flex-shrink:0}
#sb-search input{width:100%;padding:5px 8px;font-size:11px;border:1px solid #c8d4da;border-radius:5px;background:#f6f9fa;outline:none;color:#1a2530}
#sb-list{overflow-y:auto;flex:1}
#sb-status{padding:6px 10px;font-size:9px;color:#2B7A6F;border-top:1px solid #dde6ea;flex-shrink:0;background:#f6faf9}
/* 아코디언 */
.acc{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;cursor:pointer;border-bottom:1px solid #eef2f4;background:#f4f8f9;user-select:none}
.acc:hover,.acc.o{background:#e4f2ef}
.acc-nm{font-size:11px;font-weight:700;color:#1B5C54;display:flex;align-items:center;gap:4px}
.arr{font-size:9px;color:#8fa4b0;display:inline-block;transition:transform .15s}
.acc.o .arr{transform:rotate(90deg)}
.acc-n{font-size:9px;color:#8fa4b0;background:#e0e8ec;padding:1px 5px;border-radius:8px}
.items{display:none}
.acc.o+.items{display:block}
.ci{padding:5px 10px 5px 22px;font-size:11px;color:#506070;cursor:pointer;border-bottom:1px solid #f0f4f6;display:flex;justify-content:space-between;align-items:center}
.ci:hover{background:#e4f2ef;color:#1a2530}
.ci.on{background:#c4e0db;color:#1B5C54;font-weight:700;border-left:3px solid #2B7A6F;padding-left:19px}
.ci-n{font-size:9px;color:#8fa4b0;background:#e8edf0;padding:1px 4px;border-radius:3px;flex-shrink:0}
.ci.on .ci-n{background:rgba(43,122,111,.15);color:#2B7A6F}
/* 메인 */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff;border-bottom:1px solid #dde6ea;flex-shrink:0;gap:8px;flex-wrap:wrap}
#cpx-name{font-size:14px;font-weight:700}
#cpx-meta{font-size:10px;color:#7a9aaa;margin-top:1px}
.type-bar{display:flex;align-items:center;gap:5px}
.tl{font-size:10px;color:#8fa4b0}
.tb{font-size:11px;font-weight:700;padding:3px 14px;border-radius:20px;cursor:pointer;border:1.5px solid #c8d4da;color:#8fa4b0;background:#fff}
.tb:hover{border-color:#2B7A6F;color:#2B7A6F}
.tb.t매매{background:#BA7517;color:#fff;border-color:#BA7517}
.tb.t전세{background:#1B6FA8;color:#fff;border-color:#1B6FA8}
.tb.t월세{background:#2B7A6F;color:#fff;border-color:#2B7A6F}
/* 탭 */
#tabs{display:flex;padding:0 14px;background:#fff;border-bottom:1px solid #dde6ea;flex-shrink:0}
.tab{padding:8px 13px;font-size:11px;font-weight:600;color:#8fa4b0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:#1a2530}
.tab.on{color:#2B7A6F;border-bottom-color:#2B7A6F}
/* 패널 */
.panel{display:none;flex:1;overflow-y:auto;padding:12px 14px;flex-direction:column;gap:10px}
.panel.on{display:flex}
/* 카드들 */
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-shrink:0}
.met{background:#fff;border:1px solid #dde6ea;border-radius:8px;padding:10px 12px;position:relative;overflow:hidden}
.met::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.mA::before{background:#BA7517}.mB::before{background:#1B6FA8}.mT::before{background:#2B7A6F}.mS::before{background:#4A7B8C}
.ml{font-size:9px;color:#8fa4b0;font-weight:700;letter-spacing:.3px;margin-bottom:3px}
.mv{font-size:19px;font-weight:700;line-height:1.1}
.ms{font-size:9px;color:#8fa4b0;margin-top:2px}
.up{color:#D85A30}.dn{color:#1B6FA8}.ok{color:#2B7A6F}
.charts{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;flex-shrink:0}
.cc{background:#fff;border:1px solid #dde6ea;border-radius:8px;padding:12px}
.ct{font-size:11px;font-weight:700;color:#506070;margin-bottom:8px}
.cw{position:relative;height:140px}
.tc{background:#fff;border:1px solid #dde6ea;border-radius:8px;overflow:hidden;flex-shrink:0}
.th2{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #dde6ea}
.tt2{font-size:11px;font-weight:700;color:#506070}
.tn{font-size:9px;color:#8fa4b0}
table{width:100%;border-collapse:collapse;font-size:11px}
th{font-size:9px;font-weight:700;color:#8fa4b0;text-align:left;padding:6px 12px;border-bottom:1px solid #dde6ea;background:#f6f9fa;white-space:nowrap}
td{padding:6px 12px;border-bottom:1px solid #f0f4f6;white-space:nowrap}
tr:last-child td{border:none}
tr:hover td{background:#f0f8f6}
.fw{font-weight:700}
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#8fa4b0;font-size:13px;gap:10px;padding:40px}
.ei{font-size:40px}
@media(max-width:650px){#sb{display:none}.mets{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
</style>
</head>

function buildSb(q){
  q=(q||"").trim();
  var h="";
  for(var d in D){
    for(var dong in D[d]){
      var list=q?D[d][dong].filter(function(c){return c.name.indexOf(q)>=0;}):D[d][dong];
      if(!list.length) continue;
      var k=d+"|"+dong;
      var op=q?true:(open_[k]!==false);
      h+='<div class="acc'+(op?" o":"")+'" data-k="'+k+'" onclick="togAcc(this)">';
      h+='<span class="acc-nm"><span class="arr">&#9654;</span>'+dong+'</span>';
      h+='<span class="acc-n">'+list.length+'</span></div>';
      h+='<div class="items" style="'+(op?"display:block":"display:none")+'">';
      for(var i=0;i<list.length;i++){
        var c=list[i];
        var on=(sel&&sel.name===c.name)?" on":"";
        var cn=c.tradeCount?'<span class="ci-n">'+c.tradeCount+'</span>':"";
        h+='<div class="ci'+on+'" data-d="'+d+'" data-g="'+dong+'" data-nm="'+c.name.replace(/"/g,"&quot;")+'" onclick="clk(this)">'+c.name+cn+'</div>';
      }
      h+='</div>';
    }
  }
  if(!h) h='<div style="padding:20px;text-align:center;color:#8fa4b0;font-size:11px">결과 없음</div>';
  document.getElementById("sb-list").innerHTML=h;
}

function togAcc(el){

  var nx=el.nextElementSibling;
  if(nx) nx.style.display=op?"none":"block";
}

function clk(el){

}

function doSearch(v){buildSb(v);}

function pickFirst(v){
  if(!v||!v.trim()) return;
  var q=v.trim();
  for(var d in D) for(var g in D[d]) for(var i=0;i<D[d][g].length;i++){
    if(D[d][g][i].name.indexOf(q)>=0){open_[d+"|"+g]=true;pick(d,g,D[d][g][i].name);return;}
  }
}

function pick(d,g,name){
  if(!D[d]||!D[d][g]) return;
  var found=null;
  for(var i=0;i<D[d][g].length;i++){if(D[d][g][i].name===name){found=D[d][g][i];break;}}
  if(!found) return;
  sel=found; selDist=d; selDong=g;
  document.getElementById("cpx-name").textContent=name;
  document.getElementById("cpx-meta").textContent=g+" · "+(found.year?found.year+"년 준공 · ":"")+"거래 "+found.tradeCount+"건 (2025 국토부)";
  open_[d+"|"+g]=true;
  buildSb(document.getElementById("qi").value);

/* ── 시뮬 데이터 ── */
function sr(n){return((n*16807+1)&0x7fffffff)/0x7fffffff;}
function genSim(cx){
  var b=cx.name.length*137+(cx.year||2010),R={매매:[],전세:[],월세:[]};
  for(var m=0;m<6;m++){
    var types=cx.types||["84"],cnt=1+Math.floor(sr(b+m*31)*3);
    for(var i=0;i<cnt;i++){
      var s=b+m*31+i*7,t=types[i%types.length];
      var bp=(cx.bp&&(cx.bp[parseInt(t)]||cx.bp[84]))||70000;
      var fl=3+Math.floor(sr(s+2)*15);
      var act=Math.round((bp+Math.round((sr(s)*10-5)*500))/500)*500;
      var li=act+Math.round((2000+sr(s+1)*3000)/500)*500;
      R.매매.push({m:m,mL:ML[m],t:t,fl:fl,act:act,li:li});
      var jr=(cx.rr||0.63)+(sr(s+10)*0.04-0.02);
      R.전세.push({m:m,mL:ML[m],t:t,fl:fl+1,act:Math.round(act*jr/100)*100,rate:Math.round(jr*100)});
      if(i%2===0){var dep=Math.round(act*0.12/100)*100,mon=Math.round((act-dep)*0.004/10)*10;R.월세.push({m:m,mL:ML[m],t:t,fl:fl,dep:dep,mon:mon,yld:Math.round(mon*12/(act-dep)*10)/10});}
    }
  }
  return R;
}

function getRealData(name){
  var trades=TX[name];if(!trades||!trades.length) return null;
  var now=new Date(),R={매매:[],전세:[],월세:[]};
  for(var i=0;i<trades.length;i++){
    var t=trades[i],ym=String(t.ym||"202501");
    var y=parseInt(ym.slice(0,4)),mo=parseInt(ym.slice(4,6));
    var diff=(now.getFullYear()-y)*12+(now.getMonth()+1-mo);
    if(diff<0||diff>5) continue;
    var mi=5-diff;
    R.매매.push({m:mi,mL:ML[mi],t:t.areaBin||"84",fl:parseInt(t.floor)||5,act:t.price,li:Math.round(t.price*1.03/100)*100});
  }
  return R.매매.length?R:null;
}

function getData(cx){return getRealData(cx.name)||genSim(cx);}

    sorted.forEach(function(x){tbh+='<tr><td>'+x.mL+'</td><td>'+x.t+'㎡</td><td>'+x.fl+'층</td><td class="fw" style="color:#1B6FA8">'+fmt(x.act)+'</td><td style="color:#1B6FA8">'+(x.rate||"")+'%</td></tr>';});
  } else {
    thh='<tr><th>월</th><th>타입</th><th>층</th><th>보증금</th><th>월세</th><th>수익률</th></tr>';
    var ws=DATA.월세.slice().sort(function(a,b){return b.m-a.m;}).slice(0,15);
    ws.forEach(function(x){tbh+='<tr><td>'+x.mL+'</td><td>'+x.t+'㎡</td><td>'+x.fl+'층</td><td class="fw" style="color:#2B7A6F">'+fmt(x.dep)+'</td><td style="color:#2B7A6F">'+Math.round(x.mon/10000)+'만</td><td class="ok">'+x.yld+'%</td></tr>';});
  }
  document.getElementById("th").innerHTML=thh;
  document.getElementById("tb2").innerHTML=tbh;
}

/* ── 시세 비교 ── */
function renderCmp(){
  if(!sel) return;
  var cx=sel,h="";
  (cx.types||["84"]).forEach(function(t){
    var ti=parseInt(t),bp=(cx.bp&&cx.bp[ti])||70000,rr=cx.rr||0.63;
    var jv=Math.round(bp*rr/100)*100,dep=Math.round(bp*0.12/100)*100,mon=Math.round((bp-dep)*0.004/10)*10;
    var yl=Math.round(mon*12/(bp-dep)*10)/10;
    var DATA=getData(cx),cnt=DATA.매매.filter(function(x){return x.t===t;}).length;
    h+='<tr><td class="fw">'+t+'㎡</td><td class="fw" style="color:#BA7517">'+fmt(bp)+'</td><td style="color:#1B6FA8">'+Math.round(rr*100)+'%</td><td class="fw" style="color:#1B6FA8">'+fmt(jv)+'</td><td>'+fmt(dep)+'</td><td class="fw" style="color:#2B7A6F">'+Math.round(mon/10000)+'만</td><td class="ok">'+yl+'%</td><td style="color:#888">'+cnt+'건</td></tr>';
  });
  document.getElementById("cmpB").innerHTML=h;
  document.getElementById("cmpT").textContent=sel.name+" — 타입별 시세표";
}

/* ── 단지 종합표 ── */
function renderSum(){
  var rows=[],sumB="";
  for(var d in D) for(var g in D[d]) D[d][g].forEach(function(c){rows.push({c:c,d:d,g:g});});
  document.getElementById("sumN").textContent=rows.length+"개 단지";
  rows.forEach(function(r){
    var c=r.c,bp84=(c.bp&&(c.bp[84]||c.bp[59]||c.bp[74]||Object.values(c.bp)[0]))||0;
    var rr=c.rr||0.63,jv=bp84?Math.round(bp84*rr/100)*100:0;
    var ac=(sel&&sel.name===c.name)?'style="background:#e4f2ef"':'';
    sumB+='<tr '+ac+'><td class="fw" style="cursor:pointer;color:#1B5C54" onclick="pickSum(''+r.d+'',''+r.g+'',''+c.name.replace(/'/g,"\'")+'')">'+ c.name+'</td><td style="color:#888">'+r.g+'</td><td style="color:#888">'+(c.year||"-")+'</td><td class="fw" style="color:#BA7517">'+fmt(bp84)+'</td><td style="color:#1B6FA8">'+Math.round(rr*100)+'%</td><td style="color:#1B6FA8">'+fmt(jv)+'</td><td style="color:#888">'+c.tradeCount+'건</td></tr>';
  });
  document.getElementById("sumB").innerHTML=sumB;
}

function pickSum(d,g,name){open_[d+"|"+g]=true;pick(d,g,name);showTab("ov");}

/* ── 탭 ── */
function showTab(t){
  ["ov","cmp","sum"].forEach(function(id){
    document.getElementById("p"+id).className="panel"+(id===t?" on":"");
    document.getElementById("tab-"+id).className="tab"+(id===t?" on":"");
  });
}

/* ── 초기화 ── */
(function init(){
  // 모든 동 닫기, 첫 동만 열기
  var first=true;
  for(var d in D) for(var g in D[d]){open_[d+"|"+g]=first;first=false;}
  buildSb("");
  // 첫 단지 자동 선택
  for(var d2 in D){
    var gs=Object.keys(D[d2]);
    if(gs.length&&D[d2][gs[0]].length){pick(d2,gs[0],D[d2][gs[0]][0].name);break;}
  }
  renderSum();
})();
</script>
</body>
