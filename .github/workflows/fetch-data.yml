name: 용인시 실거래가 자동수집

on:
  # 매주 월요일 한국시간 오전 6시 (UTC 21시 일요일)
  schedule:
    - cron: '0 21 * * 0'
  # 수동 실행용 (Actions 탭에서 Run workflow 클릭)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          pip install PublicDataReader pandas requests

      - name: 실거래가 수집 스크립트 실행
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python scripts/fetch_data.py

      - name: data.json 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "🔄 실거래가 데이터 자동 갱신 ($(date +'%Y-%m-%d'))"
            git push
          fi
