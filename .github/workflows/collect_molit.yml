name: 국토부 실거래가 자동 수집

on:
  schedule:
    - cron: '0 23 * * 0'   # 매주 일요일 23:00 UTC = 월 08:00 KST
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 국토부 실거래가 수집
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python scripts/build_from_api.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/complexes.json data/transactions.json
          git diff --cached --quiet || git commit -m "실거래가 자동 수집 $(date +'%Y-%m-%d KST' -d '+9 hours')"
          git push
